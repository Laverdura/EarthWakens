<!doctype html>
<html lang="en" data-book-layout="chapter">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Earth Wakens</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="static/story-pages.css">
  <link rel="stylesheet" href="static/site-wide-theme.css?v=teal-silver">
  <link rel="stylesheet" href="static/chapter-pill.css?v=1">
  <style>
    html[data-book-layout="chapter"] .portfolio-header { max-width: none; padding: 12px 3vw; border: 0; }
    html[data-book-layout="chapter"] .portfolio-header::after { content: none; }
    html[data-book-layout="chapter"] .portfolio-header .brand { display: flex; }
    .portfolio-return { text-align: center; margin-block: 0 1.2rem; }
    .portfolio-return .page-back { margin: 0; padding: .35rem .85rem; }
    .portfolio-page { padding-block-start: 0; }
    .portfolio-page .chapter-heading { text-align: center; }
    html[data-book-layout="chapter"] .portfolio-page .chapter-heading h1 { margin-block-start: 0; }
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 1.2rem;
    }
    .portfolio-grid figure { margin: 0; }
    .portfolio-landscape { grid-column: 1 / -1; }
    .portfolio-portrait-single { grid-column: 1 / -1; width: min(100%, 420px); justify-self: center; }
    .portfolio-grid img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .portfolio-grid { grid-template-columns: 1fr; }
    }
    .portfolio-deck {
      display: grid;
      justify-items: center;
      gap: .65rem;
      width: fit-content;
      margin: 0 auto 1.5rem;
      padding: .35rem .85rem;
      font-weight: 700;
    }
    .portfolio-deck:focus-visible { outline: 2px solid #eed298; outline-offset: 4px; }
    .portfolio-deck-icon {
      display: grid;
      place-items: center;
      width: 2.55rem;
      aspect-ratio: 5 / 7;
      border: 1px solid #ddc897;
      border-radius: .33rem;
      background: #f0e8d5;
      color: #183b45;
      font: 1.65rem/1 Georgia, serif;
      box-shadow: 3px 3px 0 #254a55, 4px 4px 0 #ddc897, 7px 7px 0 #193540, 8px 8px 0 #ddc897;
    }
  </style>
</head>
<body class="ew-site-theme">
  <header class="site-header portfolio-header">
    <a class="brand" href="index.html" aria-label="Earth Wakens home">
      <img src="static/earth-wakens-silver-wordmark.png" alt="Earth Wakens" width="505" height="168">
    </a>
  </header>
  <main class="portfolio-page">
    <div class="chapter-heading"><h1>Portfolio</h1></div>
    <div class="portfolio-return">
      <a class="page-back" href="index.html">Back to Earth Wakens</a>
    </div>
    <a class="portfolio-deck" href="playing-deck.html">
      <span class="portfolio-deck-icon" aria-hidden="true">♠</span>
      Playing Deck
    </a>
    <section aria-label="Scenes from Earth Wakens">
      <div class="portfolio-grid">
        <figure>
          <a href="static/portfolio/moon-shot.webp"><img src="static/portfolio/moon-shot.webp" width="1085" height="1450" loading="lazy" alt="Moonlit water and a starry sky beside a tree with reaching roots"></a>
        </figure>
        <figure>
          <a href="static/portfolio/page-two.webp"><img src="static/portfolio/page-two.webp" width="1074" height="1450" loading="lazy" alt="A chained doorway framed by foliage and skeletal root hands"></a>
        </figure>
        <figure class="portfolio-portrait-single">
          <a href="static/portfolio/roots-and-shutters.jpg"><img src="static/portfolio/roots-and-shutters.jpg" width="1206" height="2622" loading="lazy" alt="Tree roots forming skeletal hands beside weathered green shutters"></a>
        </figure>
        <figure>
          <a href="static/portfolio/web-page-study.webp"><img src="static/portfolio/web-page-study.webp" width="1022" height="1450" loading="lazy" alt="An early Earth Wakens web page composition"></a>
        </figure>
        <figure>
          <a href="static/portfolio/golden-emergence.webp"><img src="static/portfolio/golden-emergence.webp" width="1024" height="1450" loading="lazy" alt="A figure dissolving into golden light among tree roots at a doorway"></a>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
