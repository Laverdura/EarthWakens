<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#060a04"/>
  <!-- Earth circle cracking open -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#3a6b1a" stroke-width="1.5" opacity="0.8"/>
  <circle cx="16" cy="16" r="8" fill="#0e1a08" stroke="#2a4f10" stroke-width="1"/>
  <!-- Crack lines radiating out -->
  <line x1="16" y1="4" x2="16" y2="10" stroke="#6ab02a" stroke-width="1.2" opacity="0.9"/>
  <line x1="16" y1="22" x2="16" y2="28" stroke="#4a8a18" stroke-width="1" opacity="0.7"/>
  <line x1="4" y1="16" x2="10" y2="16" stroke="#4a8a18" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="16" x2="28" y2="16" stroke="#4a8a18" stroke-width="1" opacity="0.6"/>
  <!-- Core glow -->
  <circle cx="16" cy="16" r="3" fill="#8fd44a" opacity="0.7"/>
  <circle cx="16" cy="16" r="1.5" fill="#c8f070" opacity="0.9"/>
</svg>
