<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Wakens · Website Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e6e1;color:#34332f;font:13px system-ui,sans-serif}header{height:66px;display:flex;align-items:center;gap:20px;padding:10px 22px;background:#faf9f6;border-bottom:1px solid #ccc9c0}strong{margin-right:auto}button,a{font:inherit;padding:9px 16px;border:1px solid #ccc9c0;border-radius:6px;background:transparent;cursor:pointer;text-decoration:none;color:inherit}button[aria-pressed=true]{background:#393d33;color:white;border-color:#393d33}main{height:calc(100dvh - 66px);padding:18px;display:flex;justify-content:center}iframe{width:100%;height:100%;border:0;background:#211b15;box-shadow:0 5px 25px #0002;transition:width .25s;border-radius:6px}iframe.phone{width:390px;max-width:100%;border:7px solid #34352f;border-radius:26px}@media(max-width:600px){header{gap:6px;padding:8px;font-size:11px}button,a{padding:8px}main{padding:8px}}</style></head><body><header><strong>EARTH WAKENS <span style="font-weight:400">/ Preview</span></strong><button id="desktop" aria-pressed="true">Desktop</button><button id="phone" aria-pressed="false">Phone</button><a href="./index.html" target="_blank">Open website ↗</a></header><main><iframe title="Earth Wakens interactive website" src="./index.html"></iframe></main><script>const frame=document.querySelector('iframe');frame.src='./index.html?v='+Date.now()+location.hash;for(const mode of ['desktop','phone'])document.getElementById(mode).onclick=()=>{frame.className=mode==='phone'?'phone':'';for(const id of ['desktop','phone'])document.getElementById(id).setAttribute('aria-pressed',id===mode?'true':'false')};</script></body></html>
