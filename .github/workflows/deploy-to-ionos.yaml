name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        require: true
        type: string
  push:
    path:
      - ./.github/workflows/deploy-to-ionos.yaml

concurrency: ${{ github.ref }}

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}
    steps:
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          data: "[${{ steps.deployment.outputs.template-variables }}, ${{ toJson(secrets) }}]"
          input-directory: deployment
          output-directory: deployment
          intermediate-data-file: deployment/.template-renderer-data

      - name: Render real site-url to all files
        run: |
          for file in `grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' .`; do
            sed -i $file -e 's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJson(steps.deployment.outputs.info).site-url }}|g'
          done

      - name: Render SSH user secret name
        run: echo SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_`echo ${{ matrix.deployment-id }} | tr '[:lower:]' '[:upper:]' | tr '-' '_'`_SSH_USERNAME >> $GITHUB_ENV

      # This static site is close to its 50 MB quota. Compare contents so that
      # unchanged artwork is skipped, and avoid temporary copies of large images.
      - name: Deploy to IONOS
        shell: bash
        env:
          DEPLOYMENT_INFO: ${{ steps.deployment.outputs.info }}
          IONOS_SSH_USER: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          deploy_host=$(jq -er '."remote-host"' <<< "$DEPLOYMENT_INFO")
          [[ "$deploy_host" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$IONOS_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          info = json.loads(os.environ['DEPLOYMENT_INFO'])
          size = sum(p.stat().st_size for p in Path('deployment').rglob('*') if p.is_file())
          quota = int(info['storage-quota'])
          if size > quota:
              raise SystemExit(f'Deployment size {size} exceeds Ionos quota {quota}')
          print(f'Deploying {size} bytes within {quota} byte quota')
          PYTHON
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file" "$known_hosts"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key_file"
          rsync -avc --inplace --delete \
            --rsh="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$known_hosts" \
            --exclude=logs --exclude=.deploy-now --exclude=.git --exclude=.github \
            deployment/ "$IONOS_SSH_USER@$deploy_host:"

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
